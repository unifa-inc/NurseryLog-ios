name: NurseryLog
options:
  bundleIdPrefix: com.nurserylog
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16"
  usesTabs: false
  indentWidth: 4

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: 15.0

targets:
  NurseryLog:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: NurseryLog
        excludes:
          - "**/*.md"
    info:
      path: NurseryLog/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nurserylog.app
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: R.swift
        script: |
          if [ -f "$PODS_ROOT/R.swift/rswift" ]; then
            RSWIFT="$PODS_ROOT/R.swift/rswift"
          else
            RSWIFT="${SRCROOT}/Pods/R.swift/rswift"
          fi
          "$RSWIFT" generate "$SRCROOT/NurseryLog/R.generated.swift"
        outputFiles:
          - $(SRCROOT)/NurseryLog/R.generated.swift
        runOnlyWhenInstalling: false

  NurseryLogTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: NurseryLogTests
    dependencies:
      - target: NurseryLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nurserylog.tests
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
